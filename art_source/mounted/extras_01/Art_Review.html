<!doctype html><meta charset="utf-8"><title>Questing Heroes Mounted Art</title><style>body{background:#273342;color:#fff;font:15px system-ui;margin:24px}header{position:sticky;top:0;background:#273342;padding:12px;z-index:1}select,input,button{padding:8px;margin:5px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(315px,1fr));gap:15px}article{background:#3e4b5c;padding:12px;border-radius:8px}canvas{image-rendering:pixelated;vertical-align:bottom}small{display:block;color:#c8d7e3}</style><header><h1>Mounted heroes</h1><input id="query" placeholder="Search hero"><select id="dir"></select><select id="pose"><option value="gallop">Battle gallop</option><option value="idle">Idle</option><option value="attack">Attack/cast</option><option value="hit">Hit</option><option value="defeated">Defeated</option></select><button id="pause">Pause</button><button id="bg">Change background</button><p>Map directions: west rows mirror east rows. Pixel-perfect native exports included.</p></header><main></main><script>
const M={"game": "Questing Heroes", "format_version": 1, "heroes": [{"id": "cresset", "name": "Wick", "group": "tavern", "banner": "Rangers", "battle_path": "assets/battle/heroes/cresset/mounted/strip.png", "walker_path": "assets/map/walkers/heroes/cresset/mounted/sheet.png", "mount": "a sturdy friendly horse", "tack_color": "teal"}, {"id": "gus_and_glen", "name": "Gus & Glen", "group": "tavern", "banner": "Rangers", "battle_path": "assets/battle/heroes/gus_and_glen/mounted/strip.png", "walker_path": "assets/map/walkers/heroes/gus_and_glen/mounted/sheet.png", "mount": "a sturdy friendly horse", "tack_color": "teal"}, {"id": "midge", "name": "Midge", "group": "tavern", "banner": "Rangers", "battle_path": "assets/battle/heroes/midge/mounted/strip.png", "walker_path": "assets/map/walkers/heroes/midge/mounted/sheet.png", "mount": "a friendly horse-sized giant hare with four long steed legs, a proper saddle and a bridle", "tack_color": "teal"}, {"id": "azure_hype", "name": "Azure Hype", "group": "student", "banner": "Rangers", "battle_path": "assets/battle/heroes/azure_hype/mounted/strip.png", "walker_path": "assets/map/walkers/heroes/azure_hype/mounted/sheet.png", "mount": "a sturdy friendly horse", "tack_color": "teal"}, {"id": "ericsonion", "name": "Ericsonion", "group": "student", "banner": "Rangers", "battle_path": "assets/battle/heroes/ericsonion/mounted/strip.png", "walker_path": "assets/map/walkers/heroes/ericsonion/mounted/sheet.png", "mount": "a sturdy friendly horse", "tack_color": "teal"}, {"id": "deepwave_the_ai", "name": "Deep Wave", "group": "student", "banner": "Rangers", "battle_path": "assets/battle/heroes/deepwave_the_ai/mounted/strip.png", "walker_path": "assets/map/walkers/heroes/deepwave_the_ai/mounted/sheet.png", "mount": "a sturdy friendly horse", "tack_color": "teal"}], "battle_format": {"sheet_size": [768, 64], "frame_size": [96, 64], "pivot": [48, 60], "facing": "E", "pose_order": ["idle", "move_a", "move_b", "move_c", "move_d", "attack", "hit", "defeated"], "gallop_frames": [1, 2, 3, 4]}, "walker_format": {"sheet_size": [192, 384], "frame_size": [48, 48], "pivot": [24, 44], "direction_order": ["S", "SW", "W", "NW", "N", "NE", "E", "SE"], "frames_per_direction": 4, "frame_duration_ms": 120, "mirrored_rows": {"SW": "SE", "W": "E", "NW": "NE"}}},cards=[],dirs=M.walker_format.direction_order;document.querySelector('#dir').innerHTML=dirs.map((d,i)=>`<option value="${i}">${d}</option>`).join('');let paused=false,start=performance.now(),time=0;const bg=['#3e4b5c','#eee8d8','#171421'];let bi=0;document.querySelector('#bg').onclick=()=>{bi=(bi+1)%bg.length;document.querySelectorAll('article').forEach(c=>c.style.background=bg[bi])};document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Play':'Pause'};document.querySelector('#query').oninput=e=>cards.forEach(c=>c.el.hidden=!c.text.includes(e.target.value.toLowerCase()));for(const h of M.heroes){const el=document.createElement('article'),title=document.createElement('h3'),label=document.createElement('small');title.textContent=h.name;label.textContent=h.id+' · '+h.banner;const a=document.createElement('canvas'),b=document.createElement('canvas');a.width=192;a.height=128;b.width=96;b.height=96;el.append(title,label,a,b);document.querySelector('main').append(el);const battle=new Image(),map=new Image();battle.src=h.battle_path;map.src=h.walker_path;cards.push({el,text:(h.name+' '+h.id+' '+h.banner).toLowerCase(),a,b,battle,map})}let last=performance.now();function draw(now){if(!paused)time+=now-last;last=now;const f=Math.floor(time/120)%4,dir=+document.querySelector('#dir').value,pose=document.querySelector('#pose').value,bf=pose==='gallop'?f+1:{idle:0,attack:5,hit:6,defeated:7}[pose];for(const c of cards){if(c.el.hidden)continue;const a=c.a.getContext('2d'),b=c.b.getContext('2d');a.imageSmoothingEnabled=b.imageSmoothingEnabled=false;a.clearRect(0,0,192,128);b.clearRect(0,0,96,96);if(c.battle.complete&&c.battle.naturalWidth)a.drawImage(c.battle,bf*96,0,96,64,0,0,192,128);if(c.map.complete&&c.map.naturalWidth)b.drawImage(c.map,f*48,dir*48,48,48,0,0,96,96)}requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script>
