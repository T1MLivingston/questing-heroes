<meta charset="utf-8">
<title>Questing Heroes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800;900&family=Alegreya:wght@500;600;700;800&display=swap">
<style>
/* Layout: a lamplit war-table. The map fills the screen; a ledger column on the right holds the hero, the army and the day's orders. The chosen faction tints every banner and frame. */
:root{
  --ink:#101413; --vellum:#1a201d; --vellum-2:#232b27; --rule:#37433d;
  --text:#ebe4cf; --muted:#a59f8a; --gilt:#d4ab52; --gilt-hi:#f2d382;
  --team:#2f8f88; --team-2:#d4ab52; --team-dark:#14302d;
  --foe:#c45a43; --good:#8cbc70; --bad:#e3705a;
  --f-display:"Alegreya SC",Georgia,serif;
  --f-body:"Alegreya",Georgia,serif;
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;background:var(--ink);color:var(--text);font:15px/1.4 var(--f-body);overflow:hidden}
button{font:inherit;color:inherit}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px;border-bottom:2px solid var(--team);padding-bottom:8px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:34px;height:40px}
.brand b{font-family:var(--f-display);font-weight:400;font-size:24px;color:var(--gilt-hi);line-height:1;display:block}
.brand small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.res{display:flex;flex-wrap:wrap;gap:6px 16px;font-variant-numeric:tabular-nums;font-weight:700}
.res span{display:inline-flex;align-items:center;gap:6px}
.res img{width:20px;height:20px}
.date{margin-left:auto;font-family:var(--f-display);font-size:17px}
.date em{font-style:normal;color:var(--muted);font-family:var(--f-body);font-size:13px;margin-left:8px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:12px;min-height:0}
.mapwrap{position:relative;min-height:0;border:1px solid var(--rule);border-radius:4px;overflow:hidden;background:#0a0c0b;touch-action:none}
#map{display:block;width:100%;height:100%;cursor:pointer;image-rendering:pixelated}
#hover{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 20px);background:rgba(16,20,19,.9);border:1px solid var(--rule);padding:6px 10px;border-radius:3px;font-size:13px;pointer-events:none}
#hover:empty{display:none}
.ledger{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto;padding-right:2px}
.card{background:var(--vellum);border:1px solid var(--rule);border-radius:4px;padding:12px}
.card.team{border-color:var(--team);box-shadow:inset 0 3px 0 var(--team)}
.card h2,.card h3{font-family:var(--f-display);font-weight:400;margin:0 0 6px;color:var(--gilt-hi);font-size:18px;text-wrap:balance}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hero-head{display:flex;gap:10px;align-items:center}
.hero-head img{width:58px;height:58px;border-radius:4px;border:2px solid var(--team);background:var(--vellum-2);image-rendering:pixelated}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:10px;text-align:center}
.stats div{background:var(--vellum-2);border-radius:3px;padding:5px 0 4px;display:grid;justify-items:center;gap:1px}
.stats img{width:22px;height:22px}
.stats b{font-size:17px;font-variant-numeric:tabular-nums;line-height:1}
.stats span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bar{height:6px;background:var(--vellum-2);border-radius:3px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--gilt)}
.bar.mana i{background:#7d8fe0}.bar.mp i{background:var(--good)}
.meter{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}
.army{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slot{position:relative;aspect-ratio:1;max-width:100%;background:var(--vellum-2);border:1px solid var(--rule);border-radius:3px;display:grid;place-items:center;cursor:pointer;padding:0}
.slot:hover{border-color:var(--team)}
.slot img{width:78%;height:78%}
.slot b{position:absolute;right:3px;bottom:1px;font-size:12px;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000}
.slot.empty{opacity:.35;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.chip{font-size:12px;border:1px solid var(--rule);border-radius:999px;padding:1px 8px;color:var(--muted)}
.chip.team{border-color:var(--team);color:var(--text)}
.sc{display:inline-flex;align-items:center;gap:3px;padding:2px 7px 2px 4px;border-radius:3px;background:var(--vellum-2);font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sc img{width:16px;height:16px}
.sc em{font-style:normal;color:var(--good);font-weight:700;font-size:12px}
.sc.neg em{color:var(--bad)}
.scs{display:flex;flex-wrap:wrap;gap:4px}
.orders{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{font-family:var(--f-display);font-size:16px;background:linear-gradient(var(--vellum-2),var(--vellum));border:1px solid rgba(212,171,82,.55);border-radius:3px;padding:8px 12px;cursor:pointer;color:var(--text)}
.btn:hover:not(:disabled){border-color:var(--gilt-hi);color:var(--gilt-hi)}
.btn:focus-visible,.slot:focus-visible,.pick:focus-visible{outline:2px solid var(--gilt-hi);outline-offset:2px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:linear-gradient(#7a5d22,#5a4318);border-color:var(--gilt-hi);color:#fff6dc}
.btn.wide{grid-column:1/-1}
.kbd{font-family:var(--f-body);font-size:11px;color:var(--muted);margin-left:4px}
.objective p{margin:0 0 4px}
.muted{color:var(--muted)}
.herosw{display:flex;gap:6px;margin-bottom:10px}
.hsel{padding:0;border:2px solid var(--rule);border-radius:4px;background:none;cursor:pointer;width:42px;height:42px;position:relative}
.hsel.on{border-color:var(--gilt-hi)}
.hsel img{width:100%;height:100%;display:block;image-rendering:pixelated}
.hsel i{position:absolute;right:1px;bottom:1px;width:8px;height:8px;border-radius:50%;background:var(--good)}
.relics{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.rl{display:grid;justify-items:center;gap:2px;font-size:10px;text-align:center;color:var(--muted);min-width:0}
.rl img{width:28px;height:28px;opacity:.3;filter:grayscale(1)}
.rl.found img,.rl.rumour img{opacity:.75;filter:none}
.rl.carried img,.rl.done img,.rl.rival img{opacity:1;filter:none}
.rl.rival span{color:var(--bad)}.rl.done span{color:var(--good)}.rl.carried span{color:var(--gilt-hi)}
.rl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.tres{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-weight:800;margin:0 0 10px;font-variant-numeric:tabular-nums}
.tres span{display:inline-flex;align-items:center;gap:5px}.tres img{width:20px;height:20px}
.ttabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px}
.ttab{position:relative;font-family:var(--f-display);font-size:16px;padding:7px 14px;border-radius:3px;border:1px solid var(--rule);background:var(--vellum-2);color:var(--muted);cursor:pointer}
.ttab:hover{color:var(--text)}
.ttab.on{background:var(--team);color:#fff;border-color:var(--team)}
.ttab.hot{color:var(--text);border-color:var(--gilt-hi);box-shadow:0 0 0 2px rgba(242,211,130,.22),0 0 14px rgba(242,211,130,.22)}
.ttab.locked{opacity:.5}
.ttab i{position:absolute;top:-8px;right:-8px;min-width:19px;height:19px;border-radius:10px;background:var(--gilt);color:#1a1a1a;font:800 11px/19px var(--f-body);font-style:normal;text-align:center;padding:0 5px}
.ttab .sg{color:var(--gilt-hi);margin-left:5px}
.ttab.on .sg{color:#fff}
.advice{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin:10px 0 12px;padding:10px 12px;border:1px solid var(--gilt);border-radius:4px;background:rgba(212,171,82,.1)}
.advice b{color:var(--gilt-hi)}
.tview-wrap{position:relative}
.tview{width:100%;height:auto;display:block;border:1px solid var(--rule);border-radius:4px}
.tv-tip{position:absolute;pointer-events:none;background:rgba(16,20,19,.94);border:1px solid var(--gilt);padding:4px 8px;font-size:13px;border-radius:3px;white-space:nowrap}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:10px}
.bcard.sugg{border-color:var(--gilt-hi);box-shadow:0 0 0 2px rgba(242,211,130,.25)}
.bcard .ribbon{align-self:flex-start;font-size:11px;letter-spacing:.1em;text-transform:uppercase;background:var(--gilt);color:#1a1a1a;padding:1px 6px;border-radius:2px;font-weight:800}
.bcard.flash{animation:fl 1.2s ease-out}
@keyframes fl{from{box-shadow:0 0 0 5px var(--gilt-hi)}}
@media (prefers-reduced-motion:reduce){.bcard.flash{animation:none}}
.maps .pick{align-items:stretch}
.mprev{width:100%;height:auto;border:1px solid var(--rule);border-radius:3px;image-rendering:pixelated;background:#0a0c0b}
.pick.chosen{box-shadow:0 0 0 2px var(--gilt-hi)}
.sizes{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:18px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:12px;height:12px;display:inline-block}
.travel{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:13px}
.travel img{width:22px;height:22px}
/* modal */
#modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(5,7,6,.78);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--vellum);border:1px solid var(--gilt);border-radius:4px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.sheet.wide{width:min(1060px,100%)}
.sheet header{padding:16px 18px 6px}
.sheet header h2{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0;color:var(--gilt-hi);text-wrap:balance;line-height:1.1}
.sheet .body{padding:4px 18px 10px}
.sheet .body p{max-width:68ch}
.sheet footer{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:10px 18px 16px}
.town{display:grid;gap:18px}
.town h3{font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--gilt-hi);margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.bcard{background:var(--vellum-2);border:1px solid var(--rule);border-radius:3px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.bcard.built{border-color:rgba(140,188,112,.45)}
.bcard h4{margin:0;font-size:15px;font-weight:800}
.bcard p{margin:0;font-size:13px;color:var(--muted)}
.cost{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px;font-variant-numeric:tabular-nums;align-items:center}
.cost span{display:inline-flex;align-items:center;gap:3px}
.cost img{width:15px;height:15px}
.cost .short{color:var(--bad)}
.tag{font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.tag.ok{color:var(--good)}.tag.no{color:var(--bad)}
.rrow{display:flex;gap:10px;align-items:center}
.rrow img{width:52px;height:52px;flex:none}
.rctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rctl input{width:64px;background:var(--ink);border:1px solid var(--rule);color:var(--text);border-radius:3px;padding:5px 6px;font:inherit;font-variant-numeric:tabular-nums}
.btn.sm{font-size:14px;padding:4px 10px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.casualties{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.casualties ul{list-style:none;padding:0;margin:4px 0 0;font-size:14px}
/* pickers */
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pick{--c:#888;--c2:#ccc;text-align:left;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 22%,var(--vellum-2)),var(--vellum-2) 60%);border:2px solid color-mix(in srgb,var(--c) 55%,transparent);border-radius:4px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0;color:var(--text)}
.pick:hover{border-color:var(--c)}
.pick .ph{display:flex;gap:10px;align-items:center}
.pick .ph img{width:52px;height:60px;flex:none;image-rendering:pixelated}
.pick .ph.hero img{width:64px;height:64px;border-radius:4px;border:2px solid var(--c)}
.pick h3{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0;line-height:1;color:var(--text)}
.pick .sub{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--c2)}
.pick p{margin:0;font-size:13px;color:var(--muted)}
.pick p b{color:var(--text)}
.swatches{display:flex;gap:3px}
.swatches i{width:18px;height:10px;border-radius:2px;display:block}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tags span{font-size:11px;padding:1px 7px;border-radius:999px;background:rgba(0,0,0,.3);color:var(--text)}
/* battle */
#battle{position:fixed;inset:0;z-index:40;background:var(--ink);display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:6px;
  padding:max(8px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(8px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bt-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px}
.bt-head h2{font-family:var(--f-display);font-weight:400;margin:0;font-size:22px;color:var(--gilt-hi)}
.queue{display:flex;gap:4px;margin-left:auto;overflow:hidden;max-width:100%}
.queue div{width:34px;height:34px;border-radius:50%;border:2px solid var(--rule);background:var(--vellum-2);flex:none}
.queue div.a{border-color:var(--team)}.queue div.f{border-color:var(--foe)}
.queue div:first-child{box-shadow:0 0 0 2px var(--gilt-hi)}
.queue img{width:100%;height:100%}
.bt-stage{position:relative;min-height:0;touch-action:none}
#btc{display:block;width:100%;height:100%}
.bt-card{position:absolute;right:8px;top:8px;width:230px;max-width:calc(100% - 16px);background:rgba(16,20,19,.93);border:1px solid var(--rule);border-radius:4px;padding:10px;pointer-events:none;font-size:13px}
.bt-card:empty{display:none}
.bt-card h4{margin:0 0 6px;font-size:15px;display:flex;align-items:center;gap:6px}
.bt-card h4 img{width:28px;height:28px}
.bt-card .scs{margin-bottom:6px}
.bt-foot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:start}
.bt-status{font-size:14px;min-height:20px;color:var(--gilt-hi);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.bt-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;grid-row:span 2}
.bt-log{list-style:none;margin:0;padding:0;font-size:13px;color:var(--muted);max-height:58px;overflow:hidden}
.bt-log li:first-child{color:var(--text)}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(520px,calc(100% - 32px))}
.toast{background:rgba(26,32,29,.96);border:1px solid var(--team);border-radius:3px;padding:8px 14px;font-size:14px;animation:tin .25s ease-out}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
@media (max-width:820px){
  body{overflow:auto}
  #app{height:auto}
  .main{grid-template-columns:1fr;grid-template-rows:62vh auto}
  .ledger{overflow:visible}
  .date{margin-left:0}
  .bt-foot{grid-template-columns:1fr}
  .bt-btns{justify-content:flex-start;grid-row:auto}
  .queue{margin-left:0}
  .bt-card{top:auto;bottom:8px;right:8px}
}
/* ---- 90s war-room skin: bevelled frames, big pixel type; what you can do glows, what you can't is greyed out ---- */
:root{--bev-hi:#7a6638;--bev-lo:#0a0806}
body{font-size:20px;line-height:1.25}
.main{grid-template-columns:minmax(0,1fr) 420px;gap:14px}
.topbar{gap:10px 18px;padding:8px 12px;border:3px solid;border-color:var(--bev-hi) var(--bev-lo) var(--bev-lo) var(--bev-hi);background:linear-gradient(#2a2318,#16120c);border-radius:2px}
.brand img{width:56px;height:56px;image-rendering:pixelated}
.brand b{font-size:30px;letter-spacing:.02em}
.brand small{font-family:var(--f-body);font-size:18px;letter-spacing:.08em}
.res{gap:8px}
.res span{gap:8px;padding:3px 12px 3px 6px;border:3px solid;border-color:var(--bev-lo) var(--bev-hi) var(--bev-hi) var(--bev-lo);background:#0d0b08;font-family:var(--f-display);font-size:24px;color:#f8e7b0;text-shadow:0 2px 0 #000}
.res img{width:34px;height:34px}
.res span.gold{font-size:30px;color:var(--gilt-hi);padding-right:16px}
.res span.gold img{width:40px;height:40px}
.date{font-size:22px}.date em{font-size:18px}
.card{border:3px solid;border-color:var(--bev-hi) var(--bev-lo) var(--bev-lo) var(--bev-hi);border-radius:2px;box-shadow:inset 0 0 0 1px rgba(212,171,82,.2);background:linear-gradient(180deg,#232a20,#161b17)}
.card.team{border-color:var(--team) var(--bev-lo) var(--bev-lo) var(--team);box-shadow:inset 0 0 0 1px rgba(212,171,82,.2)}
.card h2,.card h3{font-size:24px}
.label{font-size:16px}
.btn{font-size:20px;padding:10px 16px;border:3px solid;border-color:#d9b25c #4a3613 #4a3613 #d9b25c;border-radius:2px;background:linear-gradient(#3e3322,#211a10);text-shadow:0 2px 0 #000}
.btn:active:not(:disabled){border-color:#4a3613 #d9b25c #d9b25c #4a3613}
.btn.primary{border-color:#fff0b8 #6b4a10 #6b4a10 #fff0b8}
.btn.sm{font-size:17px;padding:6px 12px}
.btn:disabled{filter:grayscale(1);opacity:.38;text-shadow:none}
.btn.need{animation:need 1.5s ease-in-out infinite;color:#fff6dc}
@keyframes need{0%,100%{box-shadow:0 0 0 0 rgba(242,211,130,0)}50%{box-shadow:0 0 0 4px rgba(242,211,130,.5),0 0 20px rgba(242,211,130,.55)}}
.btn .bdg{display:inline-block;min-width:24px;margin-left:8px;padding:0 6px;background:var(--gilt);color:#1a1a1a;font-size:16px;border-radius:2px;text-shadow:none}
.kbd{font-size:16px}
.hero-head img{width:84px;height:84px}
.stats div{border:2px solid;border-color:var(--bev-lo) var(--bev-hi) var(--bev-hi) var(--bev-lo);background:#0d0b08}
.stats b{font-family:var(--f-display);font-size:24px}.stats img{width:28px;height:28px}.stats span{font-size:14px}
.meter{font-size:17px}.bar{height:9px}
.army{grid-template-columns:repeat(4,1fr);gap:8px}
.slot{border:3px solid;border-color:var(--bev-lo) var(--bev-hi) var(--bev-hi) var(--bev-lo);background:#0d0b08;border-radius:2px}
.slot img{width:90%;height:90%;image-rendering:pixelated}
.slot b{font-family:var(--f-display);font-size:19px;right:5px;bottom:2px;text-shadow:0 2px 0 #000,0 0 3px #000}
.armyhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.chip{font-size:16px;padding:2px 10px}
.sc{font-family:var(--f-display);font-size:15px}
#hover{font-size:19px;padding:8px 12px;border:2px solid var(--gilt)}
.sheet{border:3px solid;border-color:#d9b25c #4a3613 #4a3613 #d9b25c;border-radius:2px}
.sheet.wide{width:min(1200px,100%)}
.sheet header h2{font-size:32px}
.bcard h4{font-family:var(--f-display);font-size:18px;font-weight:600}
.bcard p{font-size:18px}

/* ---- Storybook skin: deep-sea navy frames, sunny gold for treasure, teal for go. Chunky serif type. ---- */

function makeNoise(g,scale){

function astar(sx,sy,tx,ty,cost){

  const h=i=>{const x=i%W,y=(i/W)|0;let d=oct(x,y,tx,ty);for(const[ax,ay,bd]of pl){const v=oct(x,y,ax,ay)+bd;if(v<d)d=v;}return d*50;};

    const cur=open[bi];open[bi]=open[open.length-1];open.pop();

    if([[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>{const j=idx(x+a,y+b);return tiles[j]===T.LAKE&&!isleWater.has(j)&&!(ctx.river&&ctx.river.has(j));}))shore.push({x,y,d:Math.hypot(x-town.x,y-town.y)});}

/* carve dirt tracks until every object can be reached from the town gate (portals count as links; protected tiles are never touched) */
function carveReach(tiles,objs,pseudo,town,foot,protect,isleWater,ports){
  const carveCost=(x,y)=>(x===0||y===0||x===W-1||y===H-1)?Infinity:(passableT(tiles[idx(x,y)])?TCOST[tiles[idx(x,y)]]:420);
  const oldP=PORT;PORT=ports||new Map();
  for(let guard=0;guard<140;guard++){
    const seen=new Uint8Array(W*H),st=idx(town.x,town.y),q=[st];seen[st]=1;
    const okT=(x,y)=>inb(x,y)&&(passableT(tiles[idx(x,y)])||isleWater.has(idx(x,y)))&&!foot(x,y);
    while(q.length){const i=q.pop(),x=i%W,y=(i/W)|0;const pj=PORT.get(i);if(pj!==undefined&&!seen[pj]){seen[pj]=1;q.push(pj);}
      for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const nx=x+a,ny=y+b;if(!okT(nx,ny))continue;const ni=idx(nx,ny);if(seen[ni])continue;if(a&&b&&(!okT(x+a,y)||!okT(x,y+b)))continue;seen[ni]=1;q.push(ni);}}
    const bad=[...objs,...pseudo].find(o=>!seen[idx(o.x,o.y)]);if(!bad)break;
    const edge=(x,y)=>foot(x,y)||x===0||y===0||x===W-1||y===H-1;
    const p=astar(bad.x,bad.y,town.x,town.y+1,(x,y)=>edge(x,y)||protect.has(idx(x,y))?Infinity:isleWater.has(idx(x,y))?60:carveCost(x,y));
    if(p){let prev={x:bad.x,y:bad.y};for(const c of p){const i=idx(c.x,c.y);if(!passableT(tiles[i])&&!isleWater.has(i))tiles[i]=T.DIRT;
      if(Math.abs(prev.x-c.x)===1&&Math.abs(prev.y-c.y)===1){const o1=idx(c.x,prev.y),o2=idx(prev.x,c.y);if(!(passableT(tiles[o1])&&!foot(c.x,prev.y))&&!(passableT(tiles[o2])&&!foot(prev.x,c.y))){const oc=foot(c.x,prev.y)||protect.has(o1)?o2:o1;if(!protect.has(oc)&&!isleWater.has(oc))tiles[oc]=T.DIRT;}}
      if(seen[i])break;prev=c;}}

  }

  {const seen=new Uint8Array(W*H),st=idx(town.x,town.y),q=[st];seen[st]=1;
    const okT=(x,y)=>inb(x,y)&&(passableT(tiles[idx(x,y)])||tiles[idx(x,y)]===T.LAKE)&&!foot(x,y);
    while(q.length){const i=q.pop(),x=i%W,y=(i/W)|0;const pj=PORT.get(i);if(pj!==undefined&&!seen[pj]){seen[pj]=1;q.push(pj);}
      for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const nx=x+a,ny=y+b;if(!okT(nx,ny))continue;const ni=idx(nx,ny);if(seen[ni])continue;if(a&&b&&(!okT(x+a,y)||!okT(x,y+b)))continue;seen[ni]=1;q.push(ni);}}
    for(let k=objs.length-1;k>=0;k--){const o=objs[k];if(!seen[idx(o.x,o.y)]&&!['relic','town','camp','portal','spire','dock'].includes(o.type))objs.splice(k,1);}}

function mkSpot(tiles,occupied,protect,avoid){return(x0,y0,rad)=>{for(let i=0;i<300;i++){const x=Math.round(x0+ri(-rad,rad)),y=Math.round(y0+ri(-rad,rad));

function roadAlong(tiles,pts,cost){const out=[];for(let i=1;i<pts.length;i++){const p=astar(pts[i-1].x,pts[i-1].y,pts[i].x,pts[i].y,cost)||[];for(const q of p){tiles[idx(q.x,q.y)]=T.ROAD;out.push(q);}}return out;}

  ps.slice(0,6).forEach((p,i)=>{const Rl=RELIC_LIST[i];add({type:'relic',r:i,x:p.x,y:p.y,k:Rl.k,n:ri(Rl.n[0],Rl.n[1])});});}

/* Underworld: a surface above, a dark underworld below, solid bedrock between, and portal pairs through it.
   Necromancers live below; the Glass Lair is down there too. */

  const tiles=new Array(W*H),wallY=Math.floor(H/2)-1,underY=wallY+2;
  baseNoise(g,tiles,(e,f,m,x,y)=>{if(y===wallY||y===wallY+1)return T.CRAG;
    if(y<wallY){if(e<0.27)return T.LAKE;if(e>0.72)return T.CRAG;if(f>0.67)return T.FOREST;if(m<0.3)return T.BOG;if(m>0.68)return T.HEATH;return T.GRASS;}
    if(e<0.22)return T.LAKE;if(e>0.66)return T.CRAG;if(f>0.7)return T.FOREST;if(m<0.32)return T.DIRT;if(m>0.72)return T.BOG;return T.GRASS;});
  const protect=new Set();for(let x=0;x<W;x++){protect.add(idx(x,wallY));protect.add(idx(x,wallY+1));}
  const all=[opt.fac,...opt.rivals],surf=all.map((f,i)=>({f,i})).filter(q=>q.f!=='necro'),und=all.map((f,i)=>({f,i})).filter(q=>q.f==='necro');
  const homes=new Array(all.length);
  surf.forEach((q,k)=>{homes[q.i]={x:clamp(Math.round(W*(k+0.5)/surf.length),4,W-5),y:clamp(Math.round(wallY*0.45)+(k%2?2:-1),4,wallY-4),fac:q.f};});
  und.forEach((q,k)=>{homes[q.i]={x:clamp(Math.round(W*(k%2?0.78:0.22)),4,W-5),y:clamp(underY+Math.round((H-underY)*0.55),underY+4,H-4),fac:q.f};});
  const uh=und.length?homes[und[0].i]:null;
  const lair={x:uh?(uh.x<W/2?Math.round(W*0.72):Math.round(W*0.28)):Math.round(W/2),y:Math.round(underY+(H-underY)*0.55)};
  const setT=(x,y,t)=>{if(x>0&&y>0&&x<W-1&&y<H-1&&!protect.has(idx(x,y)))tiles[idx(x,y)]=t;};
  for(const h of[...homes,lair])for(let dy=-3;dy<=2;dy++)for(let dx=-3;dx<=3;dx++)setT(h.x+dx,h.y+dy,T.GRASS);
  const np=W>=56?5:W>=44?4:3,ports=new Map(),pairs=[];
  for(let k=0;k<np;k++){const x=clamp(Math.round(W*(k+0.5)/np)+ri(-1,1),3,W-4),top={x,y:wallY-3},bot={x,y:underY+2};
    for(const p of[top,bot])for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)setT(p.x+dx,p.y+dy,T.GRASS);
    pairs.push([top,bot]);ports.set(idx(top.x,top.y),idx(bot.x,bot.y));ports.set(idx(bot.x,bot.y),idx(top.x,top.y));}
  const town=homes[0];
  const cc=(x,y)=>(x===0||y===0||x===W-1||y===H-1||protect.has(idx(x,y)))?Infinity:(passableT(tiles[idx(x,y)])?TCOST[tiles[idx(x,y)]]:420);
  const gate=h=>({x:h.x,y:h.y+1});

  roadAlong(tiles,[...homes.filter(h=>h.y>wallY).map(gate),...pairs.map(p=>p[1]),{x:lair.x,y:lair.y+1}].sort((a,b)=>a.x-b.x),cc);

  homes.forEach(h=>{if(h.fac==='pirates')isles.push(makeIsland(tiles,h.x,h.y-1,4+Math.round(KS*0.6),protect,null));});
  const isleWater=new Set();isles.forEach(il=>il.water.forEach(i=>isleWater.add(i)));

  homes.slice(1).forEach(h=>add({type:'camp',x:h.x,y:h.y,fac:h.fac}));
  add({type:'relic',r:6,x:lair.x,y:lair.y,k:'drake',n:3});
  for(const[ox,oy]of[[-1,-1],[1,-1]]){setT(lair.x+ox,lair.y+oy,T.GRASS);add({type:'neutral',x:lair.x+ox,y:lair.y+oy,k:'troll',n:ri(10,13)});}
  pairs.forEach(([a,b])=>{add({type:'portal',x:a.x,y:a.y,tx:b.x,ty:b.y});add({type:'portal',x:b.x,y:b.y,tx:a.x,ty:a.y});});

  isles.forEach(il=>isleDocks(tiles,il,W/2,wallY/2,add,occupied));

/* Four Rivers: four rivers meet around an island holding the Glass Lair. Each home has its own quarter;

function genRivers(seed,opt){
  const g=mulberry32(seed);const saveR=R;R=g;const KS=W/34,K2=KS*KS;
  const tiles=new Array(W*H);
  baseNoise(g,tiles,(e,f,m)=>e<0.22?T.LAKE:e>0.74?T.CRAG:f>0.68?T.FOREST:m<0.3?T.BOG:m>0.68?T.HEATH:T.GRASS);
  const cx=Math.round(W/2),cy=Math.round(H/2),river=new Set(),protect=new Set();
  const wet=(x,y)=>{if(!inb(x,y))return;const i=idx(x,y);tiles[i]=T.LAKE;river.add(i);protect.add(i);};
  // the island: 3 x 3 of land inside a ring of water
  for(let y=cy-3;y<=cy+3;y++)for(let x=cx-3;x<=cx+3;x++){const d=Math.max(Math.abs(x-cx),Math.abs(y-cy));if(d<=1)tiles[idx(x,y)]=T.GRASS;else if(d===2)wet(x,y);else if(tiles[idx(x,y)]===T.LAKE||!passableT(tiles[idx(x,y)]))tiles[idx(x,y)]=T.GRASS;}

  // sideways shifts need two steps between them, so the river never doubles back into a 2 x 2 pool
  const arm=(along,len,dir,fixed,startOff)=>{const pts=[];let o=startOff,last=-9;
    for(let s=0;s<len;s++){const a=along(s);const left=len-s;
      const pt=dir==='v'?{x:fixed+o,y:a}:{x:a,y:fixed+o};wet(pt.x,pt.y);pts.push(pt);
      let no=o;if(s-last>=2&&left>1){if(left<=8)no=o-Math.sign(o);else if(R()<0.28)no=clamp(o+(R()<0.5?-1:1),-3,3);}
      if(no!==o){const pt2=dir==='v'?{x:fixed+no,y:a}:{x:a,y:fixed+no};wet(pt2.x,pt2.y);pts.push(pt2);o=no;last=s;}}
    return pts;};
  const arms=[
    {pts:arm(s=>s,cy-2,'v',cx,ri(-2,2)),ax:'v'},
    {pts:arm(s=>H-1-s,H-1-(cy+2),'v',cx,ri(-2,2)),ax:'v'},
    {pts:arm(s=>s,cx-2,'h',cy,ri(-2,2)),ax:'h'},
    {pts:arm(s=>W-1-s,W-1-(cx+2),'h',cy,ri(-2,2)),ax:'h'}];
  // bridges: straight stretches with dry land on both banks
  const bridges=[],isR=(x,y)=>inb(x,y)&&river.has(idx(x,y));
  const straight=(p,ax)=>ax==='v'?isR(p.x,p.y-1)&&isR(p.x,p.y+1)&&!isR(p.x-1,p.y)&&!isR(p.x+1,p.y):isR(p.x-1,p.y)&&isR(p.x+1,p.y)&&!isR(p.x,p.y-1)&&!isR(p.x,p.y+1);

  for(const a of arms){const L=a.pts.length;for(let k=0;k<nb;k++){const want=Math.round(L*(k+1)/(nb+1));
    const c=a.pts.map((p,j)=>({p,j})).filter(q=>q.p.x>1&&q.p.y>1&&q.p.x<W-2&&q.p.y<H-2&&straight(q.p,a.ax)&&!bridges.some(b=>Math.abs(b.x-q.p.x)+Math.abs(b.y-q.p.y)<4)).sort((u,v)=>Math.abs(u.j-want)-Math.abs(v.j-want))[0];
    if(c)bridges.push({x:c.p.x,y:c.p.y,ori:a.ax==='v'?'ew':'ns',arm:a,guard:k===nb-1});}}
  const isle=[[cx-1,cy-2,'ns'],[cx+1,cy-2,'ns'],[cx-1,cy+2,'ns'],[cx+1,cy+2,'ns']].map(([x,y,ori])=>({x,y,ori,isle:true}));
  for(const b of[...bridges,...isle]){const i=idx(b.x,b.y);tiles[i]=T.ROAD;protect.delete(i);
    const banks=b.ori==='ew'?[[-1,0],[1,0]]:[[0,-1],[0,1]];for(const[dx,dy]of banks){const j=idx(b.x+dx,b.y+dy);if(!river.has(j)&&!passableT(tiles[j]))tiles[j]=T.GRASS;}}
  // the river art connects through bridges, so keep them in the river set
  // homes: one per quarter (a fifth shares the south-west)
  const Q=[[0.2,0.24],[0.8,0.24],[0.2,0.76],[0.8,0.76],[0.42,0.86]],all=[opt.fac,...opt.rivals];
  const homes=all.map((f,i)=>({x:Math.round(W*Q[i][0]),y:Math.round(H*Q[i][1]),fac:f}));
  for(const h of homes)for(let dy=-3;dy<=2;dy++)for(let dx=-3;dx<=3;dx++){const x=h.x+dx,y=h.y+dy;if(x>0&&y>0&&x<W-1&&y<H-1&&!river.has(idx(x,y)))tiles[idx(x,y)]=T.GRASS;}
  const town=homes[0];
  const cc=(x,y)=>{if(x===0||y===0||x===W-1||y===H-1)return Infinity;const i=idx(x,y);if(river.has(i)&&tiles[i]!==T.ROAD)return Infinity;return passableT(tiles[i])?TCOST[tiles[i]]:420;};

  const qOf=(x,y)=>(x<cx?0:1)+(y<cy?0:2);
  const oldP=PORT;PORT=new Map();
  for(const b of[...bridges,...isle])for(const s of[-1,1]){const e=bank(b,s);if(b.isle&&Math.max(Math.abs(e.x-cx),Math.abs(e.y-cy))<=1){roadAlong(tiles,[e,{x:cx,y:cy+(e.y<cy?-1:1)}],cc);continue;}
    const q=qOf(e.x,e.y),hs=homes.filter(h=>qOf(h.x,h.y)===q).sort((a,c)=>Math.hypot(a.x-e.x,a.y-e.y)-Math.hypot(c.x-e.x,c.y-e.y));
    if(hs[0])roadAlong(tiles,[gate(hs[0]),e],cc);else{const any=homes.slice().sort((a,c)=>Math.hypot(a.x-e.x,a.y-e.y)-Math.hypot(c.x-e.x,c.y-e.y))[0];roadAlong(tiles,[gate(any),e],cc);}}

  const isles=[],objs=[];let uid=1;
  homes.forEach(h=>{if(h.fac==='pirates')isles.push(makeIsland(tiles,h.x,h.y-1,4+Math.round(KS*0.6),protect,null));});
  // an island ring must not drown a bridge landing: the bridge then simply runs onto the island
  for(const b of[...bridges,...isle])for(const s of[-1,1]){const e=bank(b,s),j=idx(e.x,e.y);if(!river.has(j)&&!passableT(tiles[j])){tiles[j]=T.GRASS;protect.delete(j);isles.forEach(il=>il.water.delete(j));}}
  const isleWater=new Set();isles.forEach(il=>il.water.forEach(i=>isleWater.add(i)));
  const foot=(x,y)=>Math.abs(x-town.x)<=1&&y>=town.y-2&&y<=town.y;
  const occupied=(x,y)=>objs.some(o=>o.x===x&&o.y===y)||foot(x,y)||homes.some(h=>Math.abs(h.x-x)<=1&&Math.abs(h.y-y)<=1);
  const add=o=>{o.id=uid++;objs.push(o);return o;};
  const bridgeNear=(x,y)=>[...bridges,...isle].some(b=>Math.abs(b.x-x)<=1&&Math.abs(b.y-y)<=1);
  const spot=mkSpot(tiles,occupied,protect,(x,y)=>bridgeNear(x,y)||Math.max(Math.abs(x-cx),Math.abs(y-cy))<=2);
  const maxD=Math.hypot(W,H)*0.8,diff=(x,y)=>clamp(Math.hypot(x-town.x,y-town.y)/maxD,0,1);
  add({type:'town',x:town.x,y:town.y});
  homes.slice(1).forEach(h=>add({type:'camp',x:h.x,y:h.y,fac:h.fac}));
  add({type:'relic',r:6,x:cx,y:cy,k:'drake',n:3});
  // the island bridges are held by trolls; one bridge on each river is guarded too
  isle.forEach(b=>add({type:'neutral',x:b.x,y:b.y+(b.y<cy?-1:1),guard:true,k:'troll',n:ri(9,13)}));
  bridges.filter(b=>b.guard).forEach(b=>add({type:'neutral',x:b.x,y:b.y,guard:true,k:'troll',n:ri(7,10)}));
  // a spire at the head of each open bridge
  bridges.filter(b=>!b.guard).forEach(b=>{const e=bank(b,R()<0.5?-1:1);if(passableT(tiles[idx(e.x,e.y)])&&!occupied(e.x,e.y))add({type:'spire',x:e.x,y:e.y,owned:false,garrison:[]});});
  const cands=[[0.5,0.16],[0.5,0.84],[0.14,0.5],[0.86,0.5],[0.32,0.38],[0.68,0.62],[0.68,0.36],[0.32,0.64]].map(([a,b])=>({x:W*a,y:H*b}));
  placeRelics(spot,add,cands,town);
  const rnd=()=>({x:ri(2,W-3),y:ri(2,H-3)});
  fillWorld({add,spot,rnd,town,homes,diff,KS,K2,tiles,occupied,protect,isleWater,river});
  isles.forEach(il=>isleDocks(tiles,il,cx,cy,add,occupied));
  const pseudo=[];carveReach(tiles,objs,pseudo,town,foot,protect,isleWater,null);
  R=saveR;
  return{tiles,objs,town,uid,rivalSpots:homes.slice(1).map(h=>({x:h.x,y:h.y,fac:h.fac})),rivers:[...river],bridges:[...bridges,...isle].map(b=>({i:idx(b.x,b.y),ori:b.ori}))};
}

function planTo(x,y){

  return astar(HERO().x,HERO().y,x,y,(nx,ny,goal)=>{
    const i=idx(nx,ny);if(!S.explored[i]||townFoot(nx,ny))return Infinity;if(Z.has(i)&&!goal)return Infinity;const c=terrainCost(nx,ny);if(!isFinite(c))return Infinity;
    const o=objAt(nx,ny);if(o&&(o.type==='neutral'||o.type==='relic'||spireFoe(o))&&!goal)return Infinity;
    if(o&&o.type==='town'&&!townData(o).mine)return Infinity;
    if(rivalAt(nx,ny)&&!goal)return Infinity;
    const hi=heroIdxAt(nx,ny);if(hi>=0&&hi!==S.cur&&!(nx===S.town.x&&ny===S.town.y))return Infinity;

}

const amountWord=n=>n<5?'A few':n<10?'A band of':n<20?'A company of':n<50?'A host of':'A multitude of';
function stackPower(k,n,hero,h){const u=U[k];h=h||(S&&S.heroes?HERO():null);const a=u.atk+(hero&&h?hst(h,'atk'):0),d=u.def+(hero&&h?hst(h,'def'):0);return n*Math.sqrt(u.hp*(u.min+u.max)/2*(1+0.05*a)*(1+0.05*d))*(u.shots?1.2:1)*(u.fly?1.1:1);}
function armyPower(army,h){return army.reduce((s,a)=>s+stackPower(a.k,a.n,!!h,h),0);}
const seenNow=(x,y)=>S.heroes.some(h=>Math.hypot(h.x-x,h.y-y)<=vision()+0.5)||Math.hypot(S.town.x-x,S.town.y-y)<=6.5;
function threat(k,n){return threatOf(stackPower(k,n));}
function threatOf(p){const r=p/Math.max(1,armyPower(HERO().army,HERO()));
  return r<0.45?['Easy prey','#8cbc70']:r<0.85?['Manageable','#b9c76a']:r<1.25?['Even fight','#d4ab52']:r<2?['Dangerous','#e3905a']:['Deadly','#e3705a'];}
function describe(x,y){

  if(S&&x===HERO().x&&y===HERO().y&&!moving)return`<b>${HERO().name}</b> · click for orders: <b>End day</b>, town, next hero`;
  if(!S.explored[idx(x,y)])return'<span class="muted">Unexplored</span>';
  if(townFoot(x,y)){const to=S.objs.find(o=>o.type==='town'&&Math.abs(x-o.x)<=1&&y>=o.y-2&&y<=o.y);const td=townData(to);return`<b>${td.town.name}</b> · ${td.mine?'your town (enter by the gate)':`${FAC[td.fac].arch} town`}`;}

  const rv=rivalAt(x,y);if(rv&&seenNow(x,y)){const[w,col]=threatOf(armyPower(rv.army,rv));return`<b>${rv.name}</b> · rival ${FAC[rv.fac].arch} hero${rv.relics.length?` · carries ${rv.relics.map(r=>RELICS[r].name).join(', ')}`:''} · <span style="color:${col}">${w}</span>`;}

    case 'pile':return`<b>${RESNAME[o.k]}</b> · ${fmt(o.n)}`;

    case 'site':return`<b>${SITES[o.k].name}</b> · ${o.week===weekNo()?'spent until next week':`once a week: ${SITES[o.k].give}`}`;
    case 'artifact':{const it=ITEMS[o.item];return`<b style="color:${ITEM_COLS[it.lvl]}">${it.name}</b> · level ${it.lvl} ${it.tier} · ${itemTxt(o.item)}`;}

    case 'altar':return`<b>${ALTAR_NAMES[o.tier]}</b> · teaches ${SP[o.spell].name}${o.tier>1?` · needs Lore ${o.tier}`:''} · needs a spellbook`;
    case 'well':return`<b>Moonwell</b> · ${o.day===S.day?'drained until tomorrow':'restores mana'}`;
    case 'tower':return'<b>Watchtower</b> · reveals the land around it';
    case 'dock':return`<b>Dock</b> · ${HERO().boat?'you already have a boat':delivered(2)?'free boats for you':'buy a boat for 1,000 gold to sail lakes'}`;
    case 'fair':return`<b>Horse Fair</b> · ${HERO().mount==='foot'?'buy a horse for 800 gold (+40% movement)':'you are already mounted'}`;
  }
  return t;
}

function relicState(i){

  const o=S.objs.find(o=>o.type==='relic'&&o.r===i);
  if(o&&o.roam)return seenNow(o.x,o.y)?{cls:'found',short:'In sight',txt:`carried by the ${RELICS[i].lair}, close by`}:{cls:S.rumours.some(r=>r.r===i)?'rumour':'',short:'Roaming',txt:`carried by the ${RELICS[i].lair}, which roams the land`};

/* -------- adventure actions -------- */
async function walk(){
  if(moving||!path||!path.length||S.over)return;
  moving=true;
  while(path&&path.length){
    const n=path[0],cost=stepCost(HERO().x,HERO().y,n.x,n.y);
    if(HERO().mp<cost){toast('Out of movement for today. End the day to march on.');break;}
    const o=objAt(n.x,n.y),rv=rivalAt(n.x,n.y);
    if(rv||(o&&(o.type==='neutral'||o.type==='relic'||spireFoe(o)))){
      const foe=rv?{type:'rival',rival:rv,x:rv.x,y:rv.y}:o;
      const go=await fightPreview(foe);if(!go){path=null;break;}
      HERO().mp-=cost;renderUI();
      const won=await startBattle(foe);
      if(!won){moving=false;path=null;if(S&&!S.over){renderUI();save();}return;}
      if(S.pendingWin){S.pendingWin=false;moving=false;await victory();return;}
      if(!rv&&o.type!=='spire')S.objs=S.objs.filter(q=>q!==o);
      path=null;await stepHero(n);reveal(n.x,n.y,vision());renderUI();
      if(o&&o.type==='relic')await gainRelic(HERO(),[o.r]);
      break;
    }
    const jumped=Math.max(Math.abs(n.x-HERO().x),Math.abs(n.y-HERO().y))>1;
    HERO().mp-=cost;await stepHero(n);reveal(n.x,n.y,vision());path.shift();renderUI();
    if(jumped)toast(n.y>=(S.underY||1e9)?'Through the portal: down into the underworld.':'Through the portal and back into daylight.');
    if(o){const stop=await visit(o,!path.length,jumped);if(stop){path=null;break;}}
  }
  if(path&&!path.length)path=null;
  moving=false;renderUI();save();
}
async function fightPreview(o){

    body:`<div class="casualties"><div><div class="label">${HERO().name}'s army</div><ul>${HERO().army.map(a=>`<li>${a.n} ${U[a.k].pl}</li>`).join('')}</ul></div><div><div class="label">The enemy</div><ul>${enemy.map(a=>`<li>${cnt(a.n)} ${U[a.k].pl}</li>`).join('')}</ul>${enemy.length===1?unitChips(enemy[0].k):''}</div></div>${reward}

  const rec=FAC[S.fac].units.filter((k,i)=>t.built['d'+(i+1)]&&(t.pool[k]||0)>0&&maxAfford(recruitKey(k))>0);

const BC=13,BR=9;

function sAtk(s){let a=s.u.atk+s.buff.atk;if(s.side===0){const f=fx();a+=hst(HERO(),'atk')+((f.unitAtk||{})[s.k]||0);if(S.fac==='dwarves'&&S.town.built.forge&&mine0(s))a++;}else if(bt&&bt.enemyHero)a+=hst(bt.enemyHero,'atk');if(tide(s))a+=2;if(pack(s))a+=2;return a;}

function reach(s){

function drawPreview(w){
  const px=Math.max(4,Math.floor(300/W)),cv=document.createElement('canvas');cv.width=W*px;cv.height=H*px;const c=cv.getContext('2d');
  const col=['#56763a','#7b6a46','#cbb27a','#6e5c50','#41553a','#2e4f28','#6b6962','#2c5a72'];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){c.fillStyle=col[w.tiles[y*W+x]];c.fillRect(x*px,y*px,px,px);}
  if(w.underY){c.fillStyle='rgba(40,10,70,.45)';c.fillRect(0,w.underY*px,W*px,(H-w.underY)*px);}
  const dot=(x,y,r,fill,stroke)=>{c.fillStyle=fill;c.beginPath();c.arc(x*px+px/2,y*px+px/2,r,0,7);c.fill();if(stroke){c.strokeStyle=stroke;c.lineWidth=1.5;c.stroke();}};
  for(const o of w.objs){
    if(o.type==='town'){c.fillStyle=FAC.rangers.col;c.fillRect(o.x*px-px,(o.y-2)*px,px*3,px*3);c.strokeStyle='#fff';c.lineWidth=2;c.strokeRect(o.x*px-px,(o.y-2)*px,px*3,px*3);}
    else if(o.type==='camp')dot(o.x,o.y,px*1.1,FAC[o.fac].col,'#fff');
    else if(o.type==='relic')dot(o.x,o.y,px*(o.r===6?1.2:0.8),RELICS[o.r].col,'#1a1408');
    else if(o.type==='neutral'&&o.guard){c.strokeStyle='#ff6a4d';c.lineWidth=2;const cx=o.x*px+px/2,cy=o.y*px+px/2;c.beginPath();c.moveTo(cx-px,cy-px);c.lineTo(cx+px,cy+px);c.moveTo(cx+px,cy-px);c.lineTo(cx-px,cy+px);c.stroke();}
    else if(o.type==='dock'){c.fillStyle='#d9b48a';c.fillRect(o.x*px,o.y*px,px,px);}
    else if(o.type==='portal')dot(o.x,o.y,px*0.9,'#c46bff','#fff');
    else if(o.type==='spire'){c.fillStyle='#e8e4f4';c.fillRect(o.x*px,o.y*px-px,px,px*2);}
  }
  return cv.toDataURL();
}

  if(town){const port=new Map();for(const q of o)if(q.type==='portal'&&q.tx!==undefined)port.set(idx(q.x,q.y),idx(q.tx,q.ty));
    const ok=i=>S.tiles[i]<5||S.tiles[i]===T.LAKE,seen=new Uint8Array(W*H),q=[idx(town.x,town.y)];seen[q[0]]=1;
    while(q.length){const i=q.pop(),x=i%W,y=(i/W)|0;const pj=port.get(i);if(pj!==undefined&&!seen[pj]){seen[pj]=1;q.push(pj);}
      for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const nx=x+a,ny=y+b;if(!inb(nx,ny))continue;const ni=idx(nx,ny);if(seen[ni]||!ok(ni)||FOOT.has(ni))continue;if(a&&b&&(!ok(idx(x+a,y))||!ok(idx(x,y+b))))continue;seen[ni]=1;q.push(ni);}}
    out.unreach=o.filter(q=>(q.type==='relic'||q.type==='camp')&&!seen[idx(q.x,q.y)]).length;}
  out.ready=out.town&&out.relics===6&&out.lair;return out;}
function edUI(){const ck=edCheck(),tick=b=>b?'<b class="ok">✓</b>':'<b class="no">✗</b>';
  $('#edPanel').hidden=false;
  $('#edPanel').innerHTML=`<h3>Map editor</h3><input id="edName" maxlength="28" value="${esc(ED.name)}" aria-label="Map name">
    <div class="label">Terrain <span class="muted">· brush</span> ${[1,2,3].map(n=>`<button class="dchip mini${ED.brush===n?' on':''}" data-ebrush="${n}">${n}</button>`).join('')}</div>
    <div class="edgrid t">${TNAME.map((n,i)=>`<button class="edt${ED.tool==='t:'+i?' on':''}" data-etool="t:${i}" title="${n}"><i style="background:${ED_TCOL[i]}"></i>${n.replace('Deep f','F').replace('Old r','R')}</button>`).join('')}</div>
    <div class="label">Place</div>
    <div class="edgrid o">${ED_OBJS.map(([k,n,ic])=>`<button class="edt${ED.tool==='o:'+k?' on':''}" data-etool="o:${k}" title="${n}"><span>${ic}</span>${n}</button>`).join('')}</div>
    ${ED.pend?'<p class="edhint">Now click where the other end of the portal goes.</p>':'<p class="edhint muted">Drag to paint. Right-drag, the wheel or the arrow keys move the view.</p>'}
    <div class="edck">${tick(ck.town)} Town · ${tick(ck.relics===6)} Relic lairs ${ck.relics}/6 · ${tick(ck.lair)} Glass Lair · Rival camps ${ck.camps}/4${ck.unreach?` · <b class="no">${ck.unreach} cut off</b>`:''}</div>
    <label class="edx"><input type="checkbox" id="edExtras" ${ED.extras?'checked':''}> Add the usual extras when played (mines by each base, weekly sites, artifacts, spires)</label>
    <div class="edbtns"><button class="btn primary" data-eact="save">${ED.saved?'Saved':'Save'}</button><button class="btn" data-eact="play" ${ck.ready?'':'disabled title="Needs your town, six relic lairs and the Glass Lair"'}>Play it</button><button class="btn" data-eact="exit">Exit</button></div>`;
  $('#edName').oninput=e=>{ED.name=e.target.value;ED.saved=false;};$('#edExtras').onchange=e=>{ED.extras=e.target.checked;ED.saved=false;};}
function edSave(){const name=(ED.name||'').replace(/[<>]/g,'').trim()||'My map';ED.name=name;
  const m={id:ED.id||('m'+Date.now().toString(36)),name,W,H,size:ED.size,tiles:[...S.tiles],objs:JSON.parse(JSON.stringify(S.objs)).map(o=>{delete o.dfac;return o;}),underY:S.underY||0,rivers:S.rivers,bridges:S.bridges,extras:ED.extras};
  const l=loadMaps().filter(x=>x.id!==m.id);l.unshift(m);if(storeMaps(l)){ED.id=m.id;ED.saved=true;toast(`Saved “${esc(name)}”. Find it under Map on Choose your game.`);}edUI();return m;}
$('#edPanel').addEventListener('click',async e=>{const t=e.target.closest('[data-etool]'),br=e.target.closest('[data-ebrush]'),ac=e.target.closest('[data-eact]');
  if(t){ED.tool=t.dataset.etool;ED.pend=null;edUI();}else if(br){ED.brush=+br.dataset.ebrush;edUI();}
  else if(ac){const a=ac.dataset.eact;
    if(a==='save')edSave();
    else if(a==='play'){const m=edSave();edClose();const mo=await pickMap({custom:m.id});if(!mo){title();return;}
      const{fk,hid}=await pickFaction();newGame(fk,hid,mo);afterLoad();save();openTown();}
    else if(a==='exit'){if(!ED.saved){const v=await showModal({title:'Leave the editor?',body:'<p>Your changes are not saved.</p>',buttons:[{label:'Save and leave',value:'s',primary:true},{label:'Leave without saving',value:'l'},{label:'Stay',value:null}],dismiss:null});if(!v)return;if(v==='s')edSave();}
      edClose();title();}}});
function edClose(){document.getElementById('app').classList.remove('editing');$('#edPanel').hidden=true;S=null;terrainCv=null;terrainPh=null;}
function edApply(x,y){if(!inb(x,y))return false;const[kind,key]=ED.tool.split(':');ED.saved=false;
  const clearAt=(a,b)=>{const o=objAt(a,b);if(!o)return;if(o.type==='portal')S.objs=S.objs.filter(q=>!(q.type==='portal'&&((q.x===o.x&&q.y===o.y)||(q.x===o.tx&&q.y===o.ty))));else S.objs=S.objs.filter(q=>q!==o);};
  const setTile=(a,b,t)=>{if(!inb(a,b))return;const i=idx(a,b);S.tiles[i]=t;if(S.rivers)S.rivers=S.rivers.filter(j=>j!==i);if(S.bridges)S.bridges=S.bridges.filter(q=>q.i!==i);};
  if(kind==='t'){const r=ED.brush-1;for(let b=-r;b<=r;b++)for(let a=-r;a<=r;a++){const nx=x+a,ny=y+b;if(!inb(nx,ny)||FOOT.has(idx(nx,ny)))continue;setTile(nx,ny,+key);if(+key>=5)clearAt(nx,ny);}return true;}
  if(FOOT.has(idx(x,y)))return false;
  if(key==='erase'){clearAt(x,y);return true;}
  const add=o=>{clearAt(o.x,o.y);if(!passableT(S.tiles[idx(o.x,o.y)])&&o.type!=='dock')setTile(o.x,o.y,T.GRASS);o.id=S.uid++;S.objs.push(o);return o;};
  if(key==='town'){if(y<2||x<1||x>W-2||y>H-2)return false;S.objs=S.objs.filter(o=>o.type!=='town');for(let b=-2;b<=0;b++)for(let a=-1;a<=1;a++){clearAt(x+a,y+b);setTile(x+a,y+b,T.GRASS);}clearAt(x,y+1);setTile(x,y+1,T.ROAD);
    S.objs.push({type:'town',x,y,id:S.uid++});S.town.x=x;S.town.y=y;rebuildFoot();return true;}
  if(key==='camp'){if(S.objs.filter(o=>o.type==='camp').length>=4){toast('Four rival camps at most.');return false;}add({type:'camp',x,y,fac:null,dfac:FAC_ORDER[(S.objs.filter(o=>o.type==='camp').length+2)%8]});return true;}
  if(key==='relic'){const have=new Set(S.objs.filter(o=>o.type==='relic').map(o=>o.r));const r=[0,1,2,3,4,5].find(i=>!have.has(i));if(r===undefined){toast('All six relic lairs are placed. Erase one to move it.');return false;}const Rl=RELIC_LIST[r];add({type:'relic',r,x,y,k:Rl.k,n:ri(Rl.n[0],Rl.n[1])});return true;}
  if(key==='lair'){S.objs=S.objs.filter(o=>!(o.type==='relic'&&o.r===6));add({type:'relic',r:6,x,y,k:'drake',n:3});return true;}
  if(key==='monster'){const d=S.town.x>=0?clamp(Math.hypot(x-S.town.x,y-S.town.y)/(Math.hypot(W,H)*0.7),0.1,1):0.5;add({type:'neutral',x,y,...neutralAt(d)});return true;}
  if(key==='guard'){add({type:'neutral',x,y,guard:true,k:'troll',n:ri(10,14)});return true;}
  if(MINE[key]){add({type:'mine',k:key,x,y,owned:false,lvl:1});return true;}
  if(key==='pile'){const k=pick(['gold','timber','ore','amber']);add({type:'pile',k,x,y,n:k==='gold'?ri(5,10)*100:k==='amber'?ri(2,4):ri(4,8)});return true;}
  if(key==='chest'){add({type:'chest',x,y});return true;}
  if(key==='artifact'){const l=pick([1,1,2,2,3,4]);add({type:'artifact',x,y,item:pick(Object.keys(ITEMS).filter(k=>ITEMS[k].lvl===l))});return true;}
  if(key==='spire'){add({type:'spire',x,y,owned:false,garrison:[]});return true;}
  if(key==='sage'){add({type:'sage',x,y,used:[]});return true;}
  if(key==='altar'){const tier=pick([1,1,2,2,3]);add({type:'altar',x,y,tier,spell:pick([[],['swift','bark','ember','mend','entangle'],['chain','squall','raise'],['starfall']][tier])});return true;}
  if(key==='site'){add({type:'site',x,y,k:pick(Object.keys(SITES)),week:-1});return true;}
  if(key==='dock'){add({type:'dock',x,y});return true;}
  if(key==='fair'){add({type:'fair',x,y});return true;}
  if(key==='shrine'){add({type:'shrine',x,y,spell:pick(['mend','swift','bark','ember','entangle'])});return true;}
  if(key==='portal'){if(!ED.pend){ED.pend={x,y};edUI();return false;}const a=ED.pend;ED.pend=null;if(a.x===x&&a.y===y){edUI();return false;}
    add({type:'portal',x:a.x,y:a.y,tx:x,ty:y});add({type:'portal',x,y,tx:a.x,ty:a.y});rebuildPortals(S.objs);return true;}
  return false;}
function edPointer(ev,x,y){if(ev==='down'){ED.paint=new Set();ED.paintTiles=ED.tool.startsWith('t:');}
  if(!ED.paint)return;const k=x+','+y;if(ED.paint.has(k))return;ED.paint.add(k);
  if(ED.tool.startsWith('t:')){edApply(x,y);}
  else if(ev==='down'){if(edApply(x,y)){renderTerrain();edUI();}}
  if(ev==='up'){}}
function edPointerUp(){if(ED.paint&&ED.paintTiles){renderTerrain();edUI();}ED.paint=null;}
function customPreviewURL(m){const oW=W,oH=H;W=m.W;H=m.H;const url=drawPreview({tiles:m.tiles,objs:m.objs.map(o=>o.type==='camp'?{...o,fac:o.fac||'necro'}:o),underY:m.underY});W=oW;H=oH;return url;}
