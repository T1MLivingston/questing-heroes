<meta charset="utf-8">
<title>Questing Heroes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="css/game.css">

<div id="app">
  <div class="topbar">
    <div class="brand"><img id="crest" alt=""><div><b>Questing Heroes</b><small id="facline">Choose your banner</small></div></div>
    <div class="res" id="res"></div>
    <button class="relbar" id="objective" title="Your goal"></button>
    <div class="yield" id="yield" title="What you earn each day"></div>
    <div class="date" id="date"></div>
    <div class="acts"><button class="btn icon" id="bMenu" title="Game menu"><img class="bi" src="assets/ui/icons/settings.png" alt="Menu"></button></div>
  </div>
  <div class="main">
    <aside class="ledger">
      <div class="card team" id="heroCard"></div>
      <div class="card"><div class="armyhead"><h3>Army</h3><span class="muted" id="armyPow"></span></div><div class="army" id="army"></div></div>
      <div class="card" id="edPanel" hidden></div>
    </aside>
    <div class="mapcol">
    <div class="cmdbar" id="cmdbar">
      <button class="btn" id="bTown"><img class="bi" src="assets/ui/icons/town.png" alt="">Town<span class="kbd">T</span></button><div class="qicons" id="qTowns"></div>
      <button class="btn" id="bCenter" title="Centre on hero (C), next hero (H)"><img class="bi" src="assets/ui/icons/hero.png" alt="">Hero<span class="kbd">C</span></button><div class="qicons" id="qHeroes"></div>
      <button class="btn primary" id="bEnd"><img class="bi" src="assets/ui/icons/end_turn.png" alt="">End day<span class="kbd">E</span></button>
    </div>
    <div class="mapwrap"><canvas id="map" aria-label="Adventure map"></canvas><div id="miniwrap" hidden><canvas id="mini" title="Map overview: click to look there"></canvas><button id="miniTog" title="Hide or show the map overview">▾</button></div><div id="hover"></div><div id="hmenu" hidden></div><div id="loot" aria-live="polite"></div><div id="dayflip" hidden><img src="assets/ui/icons/end_turn.png" alt=""><b></b></div></div>
    </div>
  </div>
</div>

<div id="battle" hidden>
  <div class="bt-head"><h2 id="btTitle">Battle</h2><span class="muted" id="btRound"></span><div class="queue" id="queue"></div></div>
  <div class="bt-stage"><canvas id="btc" aria-label="Battlefield"></canvas><div class="bt-card" id="btCard"></div></div>
  <div class="bt-foot">
    <div class="bt-status" id="btStatus"></div>
    <div class="bt-btns">
      <button class="btn sm" id="bWait">Wait</button>
      <button class="btn sm" id="bDefend">Defend</button>
      <button class="btn sm" id="bSpell">Spellbook</button>
      <button class="btn sm" id="bAuto">Auto</button>
    </div>
    <ol class="bt-log" id="btLog"></ol>
  </div>
</div>
<div id="modal" hidden></div>
<div id="toasts" aria-live="polite"></div>

<script src="js/00-core.js"></script>
<script src="js/01-data.js"></script>
<script src="js/02-art.js"></script>
<script src="js/03-map.js"></script>
<script src="js/04-ui.js"></script>
<script src="js/05-adventure.js"></script>
<script src="js/06-rivals.js"></script>
<script src="js/07-town.js"></script>
<script src="js/08-battle.js"></script>
<script src="js/09-start.js"></script>
<script src="js/10-save.js"></script>
<script src="js/11-input.js"></script>
<script src="js/12-editor.js"></script>
<script src="js/13-boot.js"></script>
